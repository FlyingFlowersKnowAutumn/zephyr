events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 后端 max-request-size=6M，这里略大一点留 multipart 开销
    client_max_body_size 8M;

    server_tokens off;

    # 用 Docker 内置 DNS 做运行时解析。proxy_pass 直接写容器名时 nginx 只在启动时解析一次，
    # 后端容器被 recreate（IP 变化）后会一直 502，必须手动重启 nginx 才恢复。
    # 配合下面的变量写法，让 nginx 按 valid 时间重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 变量形式的 upstream：强制走 resolver 运行时解析，后端 recreate 后自动跟上新 IP
        set $gateway_upstream http://blog-gateway:8080;

        # 注意：location 里一旦出现 add_header，就会“覆盖”外层的 add_header 而不是合并。
        # 所以每个自己设置了 add_header 的 location，都必须把下面 4 个安全头再写一遍。
        # 另外统一只用 add_header 设置 Cache-Control，不再用 expires，避免出现两条相互矛盾的缓存头。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # SPA 入口绝不缓存，否则重新部署后用户会拿到旧 HTML 去请求已删除的 hash 资源
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带内容 hash 的构建产物：可放心长缓存（^~ 保证优先于下面的图片正则）
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            access_log off;
        }

        # public/ 下的原图没有 hash，只能短缓存
        location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            access_log off;
        }

        location /api/ {
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location ^~ /uploads/ {
            proxy_pass $gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }
    }
}
