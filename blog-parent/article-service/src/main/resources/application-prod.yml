server:
  port: 8082

spring:
  application:
    name: article-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos:8848}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/article_db?stringtype=unspecified}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # 生产禁止乱序补迁移
    out-of-order: false
  jpa:
    hibernate:
      # 表结构只由 Flyway 负责
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379

blog:
  # sitemap.xml / rss.xml 里使用的站点地址
  base-url: ${BLOG_BASE_URL:http://127.0.0.1}

logging:
  level:
    root: INFO
    com.example.blog.article: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
