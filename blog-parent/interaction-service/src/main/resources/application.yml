server:
  port: 8003

spring:
  application:
    name: interaction-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
  datasource:
    url: jdbc:postgresql://localhost:5432/interaction_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.blog.interaction: DEBUG