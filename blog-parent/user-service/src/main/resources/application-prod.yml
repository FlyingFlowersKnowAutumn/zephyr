server:
  port: 8002

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos:8848}
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/user_db?stringtype=unspecified}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379
      database: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          required: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      # 比 max-file-size 略大，给 multipart 边界留出开销
      max-request-size: 6MB

file:
  upload:
    # 容器内绝对路径，避免依赖工作目录
    path: ${FILE_UPLOAD_PATH:/app/uploads}
    base-url: /uploads

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # 不让健康检查每次去连 SMTP，避免探活误判和频繁建连
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.example.blog.user: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
