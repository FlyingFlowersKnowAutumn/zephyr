server:
  port: 8002

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          required: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

file:
  upload:
    path: uploads
    base-url: /uploads

jwt:
  # 本地开发占位值；生产由 application-prod.yml 的 ${JWT_SECRET} 覆盖
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789}
  expiration: 86400000
  refresh-expiration: 604800000

security:
  # 登录失败锁定：同一 IP 5 次 / 5 分钟，同一账号 10 次 / 15 分钟
  login-lock:
    ip-max-failures: ${LOGIN_LOCK_IP_MAX_FAILURES:5}
    ip-lock-minutes: ${LOGIN_LOCK_IP_LOCK_MINUTES:5}
    user-max-failures: ${LOGIN_LOCK_USER_MAX_FAILURES:10}
    user-lock-minutes: ${LOGIN_LOCK_USER_LOCK_MINUTES:15}

logging:
  level:
    com.example.blog.user: DEBUG