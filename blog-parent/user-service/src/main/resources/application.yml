server:
  port: 8002

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: blog-group
      config:
        server-addr: localhost:8848
        namespace: dev
        group: blog-group
        file-extension: yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: CHANGE_ME_USE_ENV_JWT_SECRET
  expiration: 900000
  refresh-expiration: 604800000

logging:
  level:
    com.example.blog.user: DEBUG
