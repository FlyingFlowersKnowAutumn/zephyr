x-common-env: &common-env
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_DATA_REDIS_HOST: redis
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未在 .env 中设置}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未在 .env 中设置}
  # 站点所有者邮箱：注册时据此授予 blogger 角色，未设置则一律普通用户
  BLOG_OWNER_EMAIL: ${BLOG_OWNER_EMAIL:-}

x-java-healthcheck: &java-healthcheck
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 90s

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:14.23
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未在 .env 中设置}
      POSTGRES_DB: user_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-network

  redis:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: blog-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - blog-network

  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: blog-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - blog-network

  api-gateway:
    build: ./blog-parent/api-gateway
    container_name: blog-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *common-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    networks:
      - blog-network

  article-service:
    build: ./blog-parent/article-service
    container_name: blog-article
    restart: unless-stopped
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/article_db?stringtype=unspecified
      BLOG_BASE_URL: ${BLOG_BASE_URL:-http://127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
    networks:
      - blog-network

  user-service:
    build: ./blog-parent/user-service
    container_name: blog-user
    restart: unless-stopped
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db?stringtype=unspecified
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME 未在 .env 中设置}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD 未在 .env 中设置}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/actuator/health"]
    networks:
      - blog-network

  interaction-service:
    build: ./blog-parent/interaction-service
    container_name: blog-interaction
    restart: unless-stopped
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interaction_db?stringtype=unspecified
      ARTICLE_SERVICE_URL: http://article-service:8082/api/v1/articles
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/actuator/health"]
    networks:
      - blog-network

  nginx:
    build: ./blog-frontend
    image: blog-frontend:1.0
    container_name: blog-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blog-network

  # Cloudflare Named Tunnel：token 取自 .env 的 CLOUDFLARE_TUNNEL_TOKEN，
  # 公网域名的 Public Hostname 在 Cloudflare 面板里指向 http://nginx:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: blog-cloudflared
    restart: unless-stopped
    # --protocol http2：走 TCP/443 而不是 QUIC(UDP)。家庭宽带上 UDP/443 常被限速或丢包，
    # 实测 quic 会在十几分钟出现 "no recent network activity" 断连（表现为偶发 502），
    # http2 更稳；个人博客带宽需求低，这点吞吐差别可以忽略。
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?} --protocol http2
    depends_on:
      - nginx
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nacos_data:
  nacos_logs:
  uploads_data:
